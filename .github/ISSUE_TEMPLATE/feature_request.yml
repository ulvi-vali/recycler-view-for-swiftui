name: Feature request
description: Suggest a new capability or an API improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build?
      description: The screen or behaviour you need, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: How you would like to use it. Android `RecyclerView` equivalents are welcome.
      render: swift
